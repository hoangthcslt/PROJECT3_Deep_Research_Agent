version: "3.9"

services:
  # ── PostgreSQL (Sessions, Reports, User Data) ──
  postgres:
    image: postgres:16-alpine
    container_name: mowsis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mowsis
      POSTGRES_PASSWORD: mowsis_dev_2026
      POSTGRES_DB: mowsis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mowsis"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Qdrant (Vector Database for Document Embeddings) ──
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: mowsis-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Neo4j (Knowledge Graph Database) ──
  neo4j:
    image: neo4j:5.25-community
    container_name: mowsis-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/mowsis_dev_2026
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
